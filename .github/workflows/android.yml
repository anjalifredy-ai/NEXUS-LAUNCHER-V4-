name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete English strings (Nexus branding)
        run: |
          set -e
          STRINGS=app_pojavlauncher/src/main/res/values/strings.xml
          # Full upstream string catalog (fork's copy was truncated and broke AAPT)
          curl -fsSL -o "$STRINGS" \
            https://raw.githubusercontent.com/PojavLauncherTeam/PojavLauncher/v3_openjdk/app_pojavlauncher/src/main/res/values/strings.xml
          # Nexus branding
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Nexus Launcher (Minecraft: Java Edition for Android)<\/string>/' "$STRINGS"
          sed -i 's/<string name="app_short_name">.*<\/string>/<string name="app_short_name">Nexus Launcher<\/string>/' "$STRINGS"
          sed -i 's/PojavLauncher has unexpectedly crashed/Nexus Launcher has unexpectedly crashed/' "$STRINGS"
          # Remove broken partial extras / local restore shards (duplicate AAPT with upstream catalog)
          rm -f app_pojavlauncher/src/main/res/values/strings_part*.xml
          rm -f app_pojavlauncher/src/main/res/values/strings_nexus*.xml
          rm -f app_pojavlauncher/src/main/res/values/strings_defaults_*.xml
          # Locale packs: non-positional multi-% formats break modern AAPT on debug builds
          find app_pojavlauncher/src/main/res -maxdepth 1 -type d -name 'values-*' -print -exec rm -rf {} +
          echo "strings.xml bytes: $(wc -c < "$STRINGS")"
          grep -c 'name="customctrl_addbutton"' "$STRINGS"
          grep -c 'name="main_play"' "$STRINGS"

      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          wget -q -O app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar
          ls -la app_pojavlauncher/libs/

      - name: Get JRE 8
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav
          if_no_artifact_found: warn

      - name: Get JRE17
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav
          if_no_artifact_found: warn

      - name: Get JRE21
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav
          if_no_artifact_found: warn

      - name: Note JRE availability
        run: |
          echo "JRE asset dirs:"
          ls -la app_pojavlauncher/src/main/assets/components/ || true
          if [ -d app_pojavlauncher/src/main/assets/components/jre ]; then
            echo "HAS_JRE8=1" >> $GITHUB_ENV
          else
            echo "HAS_JRE8=0" >> $GITHUB_ENV
            echo "Bundled JRE8 not found — will build noruntime APK only (JRE installable in-app)."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        continue-on-error: true
        run: |
          chmod +x ./scripts/languagelist_updater.sh || true
          ./scripts/languagelist_updater.sh || true
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Build Debug .apk (with runtime if present)
        if: env.HAS_JRE8 == '1'
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Build APK without runtime
        run: |
          mkdir -p out
          rm -rf app_pojavlauncher/src/main/assets/components/jre \
                 app_pojavlauncher/src/main/assets/components/jre-new \
                 app_pojavlauncher/src/main/assets/components/jre-21
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug-noruntime.apk

      - name: Gen md5sums
        run: |
          cd out
          for f in *.apk; do
            [ -f "$f" ] && md5sum "$f" > "${f%.apk}.md5"
          done
          ls -la

      - name: Upload APK (with runtime)
        if: env.HAS_JRE8 == '1'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.*
